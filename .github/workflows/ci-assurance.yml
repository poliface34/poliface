name: hrAI @HukukSGK CI Assurance (v1.0.6 WP-1)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/v1.0.6-*"
      - "release/v1.0.6*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci-assurance:
    name: Immutability, Deterministic ZIP, WP-1 & 4-Order 244+ Tests, Strict Cross-Val & Closed Gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (SHA-pinned actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 (SHA-pinned actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned pip and optional cross-validation / schema audit dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir pip==26.3
          python3 -m pip install --no-cache-dir -r hrai_hukuk_sgk/tests/requirements-crossval.txt
          openssl version
          python3 - << 'PY'
          import importlib.metadata as m

          expected = {
              "pip": "26.3",
              "cryptography": "50.0.2",
              "pyasn1": "0.4.8",
              "pyasn1-modules": "0.2.8",
              "jsonschema": "4.10.3",
          }
          for pkg, exp_ver in expected.items():
              actual = m.version(pkg)
              print(f"{pkg}=={actual}")
              assert actual == exp_ver, f"Pinned version mismatch for {pkg}: {actual} != {exp_ver}"
          PY

      - name: Verify frozen release immutability & v1.0.5.1 bit-for-bit deterministic rebuild
        run: |
          set -euo pipefail
          python3 -m ci.verify_immutability > /tmp/ci_immutability.json
          cat /tmp/ci_immutability.json

      - name: Run WP-1 CI assurance unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/tests -p "test_*.py" -v

      - name: Build & verify active branch deterministic ZIP (double build + clean extract parity)
        run: |
          set -euo pipefail
          rm -rf /tmp/ci_clean_active
          python3 -m ci.deterministic_zip \
            --source hrai_hukuk_sgk \
            --root-name hrai_hukuk_sgk \
            --verify-reproducible \
            --extract-to /tmp/ci_clean_active > /tmp/ci_detzip.json
          cat /tmp/ci_detzip.json

          python3 -m compileall -q /tmp/ci_clean_active/hrai_hukuk_sgk
          echo "COMPILEALL=PASS"

          python3 - << 'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          ext_root = Path("/tmp/ci_clean_active/hrai_hukuk_sgk")
          all_files = sorted(p.relative_to(ext_root).as_posix() for p in ext_root.rglob("*") if p.is_file())
          pk_hits = [
              f for f in all_files
              if b"PRIVATE KEY" in (ext_root / f).read_bytes()
              and not f.endswith(".py") and not f.endswith(".md")
          ]
          assert not pk_hits, f"Private key material found in non-code files: {pk_hits}"
          print(f"PRIVATE_KEY_SCAN=files:{len(all_files)} hits:0 PASS")

          schemas = sorted((ext_root / "schemas").glob("*.json"))
          for sp in schemas:
              Draft202012Validator.check_schema(json.loads(sp.read_text(encoding="utf-8")))
          assert len(schemas) == 13, f"Expected 13 schemas, got {len(schemas)}"
          print(f"JSON_SCHEMAS_DRAFT202012={len(schemas)}/{len(schemas)} PASS")

          configs = sorted((ext_root / "config").glob("*.json"))
          for cp in configs:
              json.loads(cp.read_text(encoding="utf-8"))
          assert len(configs) == 9, f"Expected 9 configs, got {len(configs)}"
          print(f"CONFIGS={len(configs)}/{len(configs)} PASS")
          PY

      - name: Run 4-ordering sequential regression suite on clean extract
        working-directory: /tmp/ci_clean_active/hrai_hukuk_sgk
        run: |
          python3 - << 'PY'
          import json, random, sys, time, unittest

          def collect_tests(suite):
              out = []
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      out.extend(collect_tests(item))
                  else:
                      out.append(item)
              return out

          loader = unittest.TestLoader()
          base_tests = collect_tests(loader.discover("tests", pattern="test_*.py"))
          print(f"DISCOVERED_TOTAL={len(base_tests)}", flush=True)
          assert len(base_tests) >= 244, f"Regression count shrunk below 244 baseline: {len(base_tests)}"

          orderings = [
              ("default", list(base_tests)),
              ("reverse", list(reversed(base_tests))),
          ]
          for seed in (20261124, 105142):
              shuffled = list(base_tests)
              random.Random(seed).shuffle(shuffled)
              orderings.append((f"shuffle_seed_{seed}", shuffled))

          summary = {"discovered_total": len(base_tests), "orders": []}
          for name, tests in orderings:
              suite = unittest.TestSuite(tests)
              t0 = time.monotonic()
              runner = unittest.TextTestRunner(verbosity=0, stream=open("/dev/null", "w"))
              res = runner.run(suite)
              dt = time.monotonic() - t0
              ok = res.wasSuccessful() and len(res.skipped) == 0 and len(res.unexpectedSuccesses) == 0
              print(
                  f"ORDER={name} run={res.testsRun} fail={len(res.failures)} err={len(res.errors)} "
                  f"skip={len(res.skipped)} unexp={len(res.unexpectedSuccesses)} elapsed={dt:.3f}s PASS={ok}",
                  flush=True,
              )
              summary["orders"].append({"name": name, "run": res.testsRun, "elapsed": round(dt, 3), "passed": ok})
              if not ok:
                  for t, tb in res.failures + res.errors:
                      print(f"FAILED {name}: {t}\n{tb}", flush=True)
                  sys.exit(1)

          with open("/tmp/ci_regression_summary.json", "w", encoding="utf-8") as fh:
              json.dump(summary, fh, indent=2)
          PY

      - name: Run strict & offline X.509 cross-validation, live integration_probe & publish summary
        working-directory: /tmp/ci_clean_active/hrai_hukuk_sgk
        run: |
          set -euo pipefail
          python3 -m tests.cross_validate_x509 --mode strict --summary-only > /tmp/ci_strict.json
          python3 -m tests.cross_validate_x509 --mode offline --summary-only > /tmp/ci_offline.json
          python3 -W error -m engine.trust_root.integration_probe > /tmp/ci_probe.json

          python3 - << 'PY'
          import json, os, subprocess

          imm = json.load(open("/tmp/ci_immutability.json"))
          det = json.load(open("/tmp/ci_detzip.json"))
          reg = json.load(open("/tmp/ci_regression_summary.json"))
          strict = json.load(open("/tmp/ci_strict.json"))
          offline = json.load(open("/tmp/ci_offline.json"))
          probe = json.load(open("/tmp/ci_probe.json"))

          assert imm["status"] == "PASS"
          assert det["status"] == "PASS" and det["reproducible"] is True
          assert strict["ci_audit"]["exit_code"] == 0
          assert strict["independent_cross_validation_tag"] == "INDEPENDENT_CROSS_VALIDATION=PASSED"
          assert strict["ci_audit"]["missing_parsers"] == []
          for tname, tval in strict["ci_audit"]["verification_thresholds"].items():
              assert tval["passed"] is True, f"Strict threshold failed: {tname} -> {tval}"

          assert offline["ci_audit"]["exit_code"] == 0
          assert offline["independent_cross_validation_tag"] == "INDEPENDENT_CROSS_VALIDATION=NOT_PERFORMED"
          assert offline["ci_audit"]["verification_thresholds"]["hrai_positive_accepted_and_pem_der_metadata_equal"]["passed"] is True
          assert offline["ci_audit"]["verification_thresholds"]["hrai_negative_rejected_zero_partial_meta_and_clean_cache"]["passed"] is True

          pad = probe["production_authorization_decision"]
          assert probe["production_use_authorized"] is False
          assert probe["qualified_e_signature_5070_production_ready"] is False
          assert probe["qualified_e_signature_5070_equivalent"] is False
          assert pad["checks"]["kvkk_data_residency_approved"] is False
          assert all(v == "NOT_CONFIGURED" for v in pad["integration_modes"].values())
          assert pad["technical_verification"]["audit_log_valid"] is True
          assert pad["technical_verification"]["snapshots_verified"] is True

          print("STRICT_CI_AUDIT=", json.dumps(strict["ci_audit"], ensure_ascii=False))
          print("OFFLINE_CI_AUDIT=", json.dumps(offline["ci_audit"], ensure_ascii=False))
          print("PROBE_GATES=ALL_CLOSED_VERIFIED")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              ossl_ver = subprocess.check_output(["openssl", "version"], text=True).strip()
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## hrAI `@HukukSGK` — CI Assurance Summary (`v1.0.6 WP-1`)\n\n")
                  fh.write("| Control | Observed Result |\n|---|---|\n")
                  fh.write(f"| Commit | `{os.environ.get('GITHUB_SHA', '')}` |\n")
                  fh.write(f"| Runner / OpenSSL | `ubuntu-24.04` / `{ossl_ver}` |\n")
                  fh.write(f"| Pinned Tooling | `pip==26.3`, `{json.dumps(strict['parser_versions'])}` |\n")
                  fh.write("| Frozen Archives (`v1.0.5`, `v1.0.5.1`) & `xmldsig.py` | **IMMUTABILITY PASS** (exact SHA-256, byte size & `v1.0.5.1` bit-for-bit deterministic rebuild matched `69b67a5f...`) |\n")
                  fh.write(f"| Active Branch Deterministic ZIP | **REPRODUCIBLE PASS** (`build_1 == build_2 == {det['build_1_sha256']}`, `{det['size_bytes']}` B, `{det['file_count']}` files) |\n")
                  fh.write(f"| Clean 4-Order Full Suite | **{reg['discovered_total']}/{reg['discovered_total']} PASS** (`default`, `reverse`, `seed=20261124`, `seed=105142`) |\n")
                  fh.write(f"| Cross-Validation (`strict`) | **`exit_code=0`**, `{strict['independent_cross_validation_tag']}`, `missing_parsers=[]`, `6/6` thresholds PASS |\n")
                  fh.write(f"| Cross-Validation (`offline`) | **`exit_code=0`**, `{offline['independent_cross_validation_tag']}` |\n")
                  fh.write("| Production / 5070 / KVKK Gates | **ALL CLOSED** (`production_use_authorized=false`, `5070=false`, `kvkk=false`, `NOT_CONFIGURED`) |\n")
          PY
